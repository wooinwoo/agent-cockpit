<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpit - Login</title>
<style>body{background:#0f172a;color:#e2e8f0;font-family:system-ui;display:grid;place-items:center;min-height:100dvh;margin:0}main{width:min(24rem,85vw)}input,button{box-sizing:border-box;width:100%;padding:.8rem;margin-bottom:1rem;font:inherit}#error{color:#f87171}</style></head>
<body><main><h1>Cockpit Dashboard</h1><p>접속 토큰을 입력하세요.</p><form id="login"><label for="token">접속 토큰</label><input id="token" type="password" autocomplete="off" required><p id="error" role="alert"></p><button>로그인</button></form></main>
<script>document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value.trim()})});if(response.ok)location.href='/';else document.querySelector('#error').textContent=response.status===429?'잠시 후 다시 시도하세요.':'토큰을 확인하세요.';}catch{document.querySelector('#error').textContent='서버에 연결할 수 없습니다.';}});</script></body></html>

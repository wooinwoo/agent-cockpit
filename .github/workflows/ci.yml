name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ui:build
      - name: Install terminal and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          npx playwright-core install --with-deps chromium
      - name: Verify real terminal restart and browser scroll
        run: npm run test:integration
